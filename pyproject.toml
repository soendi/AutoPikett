[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autopikett"
version = "1.0.10"
description = "Schaltet das Pikett zeitgesteuert per Telefonanruf ein und aus"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "soendi" }
]
dependencies = []

[project.optional-dependencies]
windows = [
  "pystray>=0.19",
  "pillow>=10.0",
  "pywinauto>=0.6.8",
]

[project.scripts]
autopikett = "autopikett.app:main"

[tool.setuptools]
packages = ["autopikett"]
